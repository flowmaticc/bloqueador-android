# Pruebas de cada cambio que no va directo a main: tests unitarios de la app, compilación de
# depuración y tests del servicio de reportes. No firma ni publica nada.

name: Pruebas

on:
  push:
    branches-ignore: [main]
    paths-ignore: ["docs/**", "**.md", "LICENSE"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Tests unitarios y compilación
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Detalle de los tests fallidos
        if: failure()
        run: |
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            grep -q "<failure" "$f" 2>/dev/null || continue
            echo "::group::$f"
            sed -n '/<failure/,/<\/failure>/p' "$f" | head -80
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: informes-tests
          path: app/build/reports/tests/
          retention-days: 7

  reportes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Tests del servicio de reportes
        working-directory: reportes
        run: npm test
