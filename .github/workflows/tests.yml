# Pruebas de cada cambio que no va directo a main: tests unitarios de la app, compilación de
# depuración y tests del servicio de reportes. No firma ni publica nada.

name: Pruebas

on:
  push:
    branches-ignore: [main]
    paths-ignore: ["docs/**", "**.md", "LICENSE"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Tests unitarios y compilación
        run: ./gradlew --no-daemon :app:testGithubDebugUnitTest :app:assembleGithubDebug :app:assembleFdroidDebug

      - name: Detalle de los tests fallidos
        if: failure()
        run: |
          for f in app/build/test-results/testGithubDebugUnitTest/*.xml; do
            grep -q "<failure" "$f" 2>/dev/null || continue
            echo "::group::$f"
            sed -n '/<failure/,/<\/failure>/p' "$f" | head -80
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: informes-tests
          path: app/build/reports/tests/
          retention-days: 7

  reportes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Tests del servicio de reportes
        working-directory: reportes
        run: npm test
