# Compila, prueba y publica la app en GitHub Releases. Dos canales:
#
#   Beta    → cada cambio en main, SOLO si la variable del repositorio PUBLICAR_BETA es "true"
#             (interruptor: mientras se trabaja a diario se deja apagado para no llenar de versiones).
#             Es una única pre-release "beta" que se sustituye en cada publicación.
#   Estable → solo a mano (Actions → Publicar → Run workflow → canal "estable"), y la firma pide la
#             aprobación del entorno "estable" (Settings → Environments → Required reviewers).
#
# La app lee el update.json de cada canal como fichero estático:
#   estable: releases/latest/download/update.json      beta: releases/download/beta/update.json
#
# Seguridad: el job que compila y firma no puede escribir en el repositorio; el que publica puede
# escribir pero no ve la clave de firma. Antes de publicar se comprueba que el APK lleva firma v2+v3
# con el certificado esperado (variable CERT_SHA256).
#
# versionCode (ver app/build.gradle.kts): estable = appVersionCode*1000+999 (lo mismo que obtiene F-Droid al
# compilar desde el código); beta = appVersionCode*1000 + (número de ejecución % 999).
#
# F-Droid / IzzyOnDroid: con la variable PUBLICAR_FDROID = "true", cada estable lleva además el APK de la
# variante fdroid (sin actualizador propio), firmado con la misma clave: bloqueador-X.Y.Z-fdroid.apk.

name: Publicar

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "LICENSE", "reportes/**"]
  workflow_dispatch:
    inputs:
      canal:
        description: "Canal"
        type: choice
        options: [beta, estable]
        default: beta
      aviso:
        description: "Aviso opcional que verá el usuario junto a la actualización"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: publicar-${{ github.event_name == 'workflow_dispatch' && inputs.canal || 'beta' }}
  cancel-in-progress: false

jobs:
  compilar:
    # En un push, solo con el interruptor encendido.
    if: github.event_name == 'workflow_dispatch' || vars.PUBLICAR_BETA == 'true'
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.canal == 'estable') && 'estable' || 'beta' }}
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      name: ${{ steps.version.outputs.name }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Calcular versión y canal
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          CANAL: ${{ github.event_name == 'workflow_dispatch' && inputs.canal || 'beta' }}
        run: |
          base=$(grep '^appVersionName=' gradle.properties | cut -d= -f2)
          major=$(grep '^appVersionCode=' gradle.properties | cut -d= -f2)
          beta_build=$(( ${{ github.run_number }} % 999 ))
          if [ "$CANAL" = "estable" ]; then
            channel=stable
            tag="v$base"
            name="$base"
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::La versión $tag ya está publicada. Sube appVersionName en gradle.properties."
              exit 1
            fi
            code=$((major * 1000 + 999))
            beta_arg=""
          else
            channel=beta
            code=$((major * 1000 + beta_build))
            beta_arg="-PbetaBuild=$beta_build"
            tag=beta
            # La beta lleva el número de la versión siguiente a la última estable publicada: si
            # gradle.properties no va por delante, se usa la siguiente corrección (0.3.2 → 0.3.3).
            last=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null)
            last="${last#v}"
            if [ -n "$last" ] && [ "$(printf '%s\n%s\n' "$base" "$last" | sort -V | tail -1)" = "$last" ]; then
              IFS=. read -r ma mi pa <<< "$last"
              base="$ma.$mi.$((pa + 1))"
            fi
            name="${base}-beta.$(date -u +%Y%m%d).${GITHUB_SHA::7}"
          fi
          {
            echo "tag=$tag"
            echo "name=$name"
            echo "code=$code"
            echo "beta_arg=$beta_arg"
            echo "channel=$channel"
            echo "apk=bloqueador-$name.apk"
            echo "base=${tag#v}"
          } >> "$GITHUB_OUTPUT"
          echo "Versión $name ($code) · canal $channel"

      - name: Preparar la clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Faltan los secretos de firma en el entorno (RELEASE_KEYSTORE_BASE64…)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tests y compilación firmada
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          PUBLICAR_FDROID: ${{ vars.PUBLICAR_FDROID }}
        run: |
          set -o pipefail
          tasks=":app:testGithubReleaseUnitTest :app:assembleGithubRelease"
          if [ "${{ steps.version.outputs.channel }}" = "stable" ] && [ "$PUBLICAR_FDROID" = "true" ]; then
            tasks="$tasks :app:assembleFdroidRelease"
          fi
          ./gradlew --no-daemon $tasks ${{ steps.version.outputs.beta_arg }} \
            -PversionName=${{ steps.version.outputs.name }} 2>&1 | tee build.log
          # El versionCode lo calcula Gradle desde gradle.properties: tiene que coincidir con el previsto.
          got=$("$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2" dump badging app/build/outputs/apk/github/release/app-github-release.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          [ "$got" = "${{ steps.version.outputs.code }}" ] || { echo "::error::versionCode $got, se esperaba ${{ steps.version.outputs.code }}"; exit 1; }
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Errores de compilación y tests
        if: failure()
        run: |
          # Como avisos del flujo: se ven en la página de la ejecución sin descargar el registro.
          grep -E '^e: |^> Task .* FAILED|Test.*FAILED|What went wrong' build.log | head -20 | while read -r l; do
            echo "::error::$l"
          done
          for f in app/build/test-results/*/*.xml; do
            grep -q "<failure" "$f" 2>/dev/null || continue
            grep -o '<failure message="[^"]*"' "$f" | head -3 | while read -r l; do echo "::error::$(basename "$f"): $l"; done
          done

      - name: Comprobar el APK (versión normal, firma v2+v3, certificado esperado)
        env:
          CERT_SHA256: ${{ vars.CERT_SHA256 }}
        run: |
          for apk in app/build/outputs/apk/*/release/app-*-release.apk; do
          echo "Comprobando $apk"
          if unzip -p "$apk" 'classes*.dex' | grep -a -q -E 'QueryLog|consultas-|app/bloqueador/loadtest'; then
            echo "::error::El APK contiene código de depuración o de pruebas: no se publica."
            exit 1
          fi
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/aapt2" dump badging "$apk" | grep -q "^package: name='app.bloqueador'" || { echo "::error::Paquete inesperado"; exit 1; }
          if "$bt/aapt2" dump badging "$apk" | grep -q "application-debuggable"; then
            echo "::error::El APK es de depuración: no se publica."; exit 1
          fi
          out=$("$bt/apksigner" verify -v --print-certs "$apk")
          echo "$out" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" || { echo "::error::Sin firma v2"; exit 1; }
          echo "$out" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" || { echo "::error::Sin firma v3"; exit 1; }
          # La huella del certificado (64 hex), sea cual sea el formato de la línea en cada versión de apksigner.
          got=$(echo "$out" | grep -i "certificate SHA-256 digest" | grep -m1 -oiE '[0-9a-f]{64}' | tr 'A-F' 'a-f' || true)
          if [ -z "$got" ]; then
            echo "::error::No se pudo leer la huella del certificado. Salida de apksigner:"
            echo "$out" | grep -iE "signer|digest|verified" || echo "$out" | head -40
            exit 1
          fi
          if [ -z "$CERT_SHA256" ]; then
            echo "::error::Falta la variable del repositorio CERT_SHA256 (huella del certificado de firma)."; exit 1
          fi
          if [ "$got" != "$(echo "$CERT_SHA256" | tr 'A-F' 'a-f' | tr -d ': ')" ]; then
            echo "::error::El APK está firmado con otro certificado ($got). No se publica."; exit 1
          fi
          # Sin el bloque DEPENDENCY_INFO (0x504b4453) en la firma: F-Droid e IzzyOnDroid lo rechazan.
          if python3 - "$apk" <<'PY'
          import struct, sys
          d = open(sys.argv[1], "rb").read()
          e = d.rfind(b"PK\x05\x06"); cd = struct.unpack("<I", d[e + 16:e + 20])[0]
          size = struct.unpack("<Q", d[cd - 24:cd - 16])[0]; p = cd - size
          while p < cd - 24:
              n, i = struct.unpack("<QI", d[p:p + 12])
              if i == 0x504b4453: sys.exit(0)
              p += 8 + n
          sys.exit(1)
          PY
          then
            echo "::error::El APK lleva el bloque DEPENDENCY_INFO (dependenciesInfo en build.gradle.kts)."; exit 1
          fi
          echo "APK comprobado: v2+v3, certificado $got"
          if [[ "$apk" == *fdroid* ]] && "$bt/aapt2" dump permissions "$apk" | grep -q REQUEST_INSTALL_PACKAGES; then
            echo "::error::El APK de F-Droid no debe pedir instalar paquetes."; exit 1
          fi
          done

      - name: Preparar ficheros de la publicación
        env:
          AVISO: ${{ github.event_name == 'workflow_dispatch' && inputs.aviso || '' }}
          MIN_SAFE: ${{ vars.MIN_SAFE_VERSION_CODE || '0' }}
        run: |
          mkdir -p out
          apk="${{ steps.version.outputs.apk }}"
          cp app/build/outputs/apk/github/release/app-github-release.apk "out/$apk"
          if [ -f app/build/outputs/apk/fdroid/release/app-fdroid-release.apk ]; then
            cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk "out/${apk%.apk}-fdroid.apk"
          fi
          sha=$(sha256sum "out/$apk" | cut -d' ' -f1)
          # Notas en español (NOVEDADES.md) e inglés (NOVEDADES.en.md): la sección de la versión
          # ("## 0.4.0") o, si no hay, la de la próxima versión. La app muestra las de su idioma.
          section() { awk -v h="## $2" '$0==h{f=1;next} /^## /{f=0} f' "$1"; }
          base="${{ steps.version.outputs.base }}"
          notes="$(section NOVEDADES.md "$base")"
          [ -n "$notes" ] || notes="$(section NOVEDADES.md "Próxima versión")"
          notes_en="$(section NOVEDADES.en.md "$base")"
          [ -n "$notes_en" ] || notes_en="$(section NOVEDADES.en.md "Next version")"
          if [ "${{ steps.version.outputs.channel }}" = "stable" ]; then
            for f in NOVEDADES.md NOVEDADES.en.md; do
              [ -n "$(section "$f" "$base")" ] || { echo "::error::Falta la sección '## $base' en $f"; exit 1; }
            done
          fi
          # En GitHub, las dos: primero español y debajo inglés. Encima, qué APK descargar y Obtainium
          # (ya configurado: solo estables y sin el APK -fdroid).
          obtainium='https://apps.obtainium.imranr.dev/redirect?r=obtainium://app/%7B%22id%22%3A%22app.bloqueador%22%2C%22url%22%3A%22https%3A%2F%2Fgithub.com%2Fflowmaticc%2Fbloqueador-android%22%2C%22author%22%3A%22flowmaticc%22%2C%22name%22%3A%22Garbillo%22%2C%22additionalSettings%22%3A%22%7B%5C%22includePrereleases%5C%22%3Afalse%2C%5C%22apkFilterRegEx%5C%22%3A%5C%22fdroid%5C%22%2C%5C%22invertAPKFilter%5C%22%3Atrue%7D%22%7D'
          {
            printf '📥 **`%s`** · [Obtainium](%s)\n\n' "$apk" "$obtainium"
            if [ -f "out/${apk%.apk}-fdroid.apk" ]; then
              printf '_`%s`: sin actualizador, para tiendas como F-Droid · no updater, for stores like F-Droid._\n\n' "${apk%.apk}-fdroid.apk"
            fi
            printf '%s\n\n---\n\n**English**\n\n%s\n' "$notes" "$notes_en"
          } > out/notas.md
          jq -n \
            --argjson versionCode "${{ steps.version.outputs.code }}" \
            --arg versionName "${{ steps.version.outputs.name }}" \
            --arg channel "${{ steps.version.outputs.channel }}" \
            --arg tag "${{ steps.version.outputs.tag }}" \
            --arg apk "$apk" \
            --arg sha256 "$sha" \
            --arg notes "$notes" \
            --arg notes_en "$notes_en" \
            --arg notice "$AVISO" \
            --argjson minSafeVersionCode "$MIN_SAFE" \
            '{versionCode:$versionCode, versionName:$versionName, channel:$channel, tag:$tag, apk:$apk,
              sha256:$sha256, notes:$notes, notes_en:$notes_en, minSafeVersionCode:$minSafeVersionCode}
             + (if $notice == "" then {} else {notice:$notice} end)' > out/update.json
          cat out/update.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publicacion
          path: out/
          retention-days: 7

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    # Escribe en el repositorio, pero no tiene ningún secreto de firma.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: publicacion
          path: out

      - name: Publicar en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.compilar.outputs.tag }}
          NAME: ${{ needs.compilar.outputs.name }}
          CHANNEL: ${{ needs.compilar.outputs.channel }}
        run: |
          notes_file=out/notas.md
          files=$(ls out/* | grep -v notas.md)
          if [ "$CHANNEL" = "beta" ]; then
            # Una sola beta: se sustituye. La antigua "nightly" (hasta la 0.3.x) se retira.
            gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
            gh release delete beta --cleanup-tag --yes 2>/dev/null || true
            { printf 'Versión de prueba con lo que llegará en la próxima versión estable. · Test version with what will come in the next stable release.\n\n'; cat "$notes_file"; } > beta.md
            gh release create beta $files --prerelease --target "$GITHUB_SHA" \
              --title "Beta $NAME" --notes-file beta.md
          else
            gh release create "$TAG" $files --target "$GITHUB_SHA" --latest \
              --title "Garbillo $TAG" --notes-file "$notes_file"
          fi

      - name: Retirar los archivos de versiones antiguas
        if: needs.compilar.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Las publicaciones se quedan como historial con sus notas, pero solo las dos estables más
          # recientes conservan el APK (la actual y una anterior por si hay que volver atrás).
          marker="Los archivos de esta versión se han retirado"
          gh api "repos/$GH_REPO/releases" --paginate \
            -q '.[] | select(.prerelease == false and .draft == false) | [.tag_name, .created_at, (.assets | length)] | @tsv' \
            | sort -t$'\t' -k2 -r | tail -n +3 | while IFS=$'\t' read -r tag created assets; do
              [ "$assets" -eq 0 ] && continue
              echo "Retirando los archivos de $tag"
              gh release view "$tag" --json assets -q '.assets[].name' | while read -r name; do
                gh release delete-asset "$tag" "$name" --yes
              done
              body=$(gh release view "$tag" --json body -q .body)
              if ! grep -q "$marker" <<< "$body"; then
                gh release edit "$tag" --notes "$(printf '%s\n\n---\n_%s para que no se instalen versiones antiguas. Descarga la versión estable más reciente._' "$body" "$marker")"
              fi
            done
