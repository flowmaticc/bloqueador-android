# Compila, prueba y publica la app en GitHub Releases según el canal:
#
#   Estable  → etiqueta vX.Y.Z            (publicación normal)
#   Beta     → etiqueta vX.Y.Z-beta.N     (o -rc.N; marcada como pre-release)
#   Nightly  → cada cambio en main        (pre-release "nightly", se sustituye en cada cambio)
#
# La app busca actualizaciones en estas publicaciones (ver app/.../appupdate). Cada una lleva el APK
# firmado y un update.json con versionCode, versionName y huella SHA-256.
#
# El versionCode es 2000 + número de ejecución de este flujo: siempre crece, en cualquier canal.

name: Publicar

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**.md", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Calcular versión y canal
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(grep '^appVersionName=' gradle.properties | cut -d= -f2)
          code=$((2000 + ${{ github.run_number }}))
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            name="${tag#v}"
            if [[ "$name" == *-beta* || "$name" == *-rc* ]]; then channel=beta; else channel=stable; fi
            # Si esta versión ya está publicada, no se vuelve a compilar ni publicar.
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "La versión $tag ya está publicada: no se hace nada."
            fi
          else
            tag=nightly
            name="${base}-nightly.$(date -u +%Y%m%d).${GITHUB_SHA::7}"
            channel=nightly
          fi
          {
            echo "tag=$tag"
            echo "name=$name"
            echo "code=$code"
            echo "channel=$channel"
            echo "apk=bloqueador-$name.apk"
          } >> "$GITHUB_OUTPUT"
          echo "Versión $name ($code) · canal $channel"

      - name: Preparar la clave de firma
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Faltan los secretos de firma del repositorio (RELEASE_KEYSTORE_BASE64…)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tests y compilación firmada
        if: steps.version.outputs.skip != 'true'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testReleaseUnitTest :app:assembleRelease \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }} 2>&1 | tee build.log

      - name: Errores de compilación y tests
        if: failure()
        run: |
          # Como avisos del flujo: se ven en la página de la ejecución sin descargar el registro.
          grep -E '^e: |^> Task .* FAILED|Test.*FAILED|What went wrong' build.log | head -20 | while read -r l; do
            echo "::error::$l"
          done
          for f in app/build/test-results/*/*.xml; do
            grep -q "<failure" "$f" 2>/dev/null || continue
            grep -o '<failure message="[^"]*"' "$f" | head -3 | while read -r l; do echo "::error::$(basename "$f"): $l"; done
          done

      - name: Comprobar que el APK es la versión normal
        if: steps.version.outputs.skip != 'true'
        run: |
          # Solo se publica la app normal: sin el registro de depuración ni herramientas de pruebas.
          apk=app/build/outputs/apk/release/app-release.apk
          if unzip -p "$apk" 'classes*.dex' | grep -a -q -E 'QueryLog|consultas-|app/bloqueador/loadtest'; then
            echo "::error::El APK contiene código de depuración o de pruebas: no se publica."
            exit 1
          fi
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$aapt" dump badging "$apk" | grep -q "^package: name='app.bloqueador'" || { echo "::error::Paquete inesperado"; exit 1; }
          if "$aapt" dump badging "$apk" | grep -q "application-debuggable"; then
            echo "::error::El APK es de depuración: no se publica."; exit 1
          fi
          echo "APK normal comprobado."

      - name: Preparar ficheros de la publicación
        if: steps.version.outputs.skip != 'true'
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/${{ steps.version.outputs.apk }}"
          sha=$(sha256sum "out/${{ steps.version.outputs.apk }}" | cut -d' ' -f1)
          cat > out/update.json <<EOF
          {
            "versionCode": ${{ steps.version.outputs.code }},
            "versionName": "${{ steps.version.outputs.name }}",
            "channel": "${{ steps.version.outputs.channel }}",
            "apk": "${{ steps.version.outputs.apk }}",
            "sha256": "$sha"
          }
          EOF
          cat out/update.json

      - name: Publicar en GitHub Releases
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          # Las notas salen de NOVEDADES.md: la sección de la versión ("## 0.3.0") o, para nightly y
          # beta sin sección propia, "## Próxima versión".
          section() { awk -v h="## $1" '$0==h{f=1;next} /^## /{f=0} f' NOVEDADES.md; }
          base="${tag#v}"; base="${base%%-*}"
          notes="$(section "$base")"
          [ -n "$notes" ] || notes="$(section "Próxima versión")"
          case "${{ steps.version.outputs.channel }}" in
            nightly)
              gh release delete nightly --cleanup-tag --yes || true
              gh release create nightly out/* --prerelease --target "$GITHUB_SHA" \
                --title "Nightly ${{ steps.version.outputs.name }}" \
                --notes "$(printf 'Versión de desarrollo, con lo que llegará en la próxima versión:\n%s' "$notes")"
              ;;
            beta)
              gh release create "$tag" out/* --prerelease --title "Garbillo $tag (beta)" --notes "$notes"
              ;;
            stable)
              if [ -z "$(section "$base")" ]; then
                echo "::error::Falta la sección '## $base' en NOVEDADES.md"; exit 1
              fi
              gh release create "$tag" out/* --title "Garbillo $tag" --notes "$notes"
              ;;
          esac
