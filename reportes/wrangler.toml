# Servicio de reportes de Garbillo (Cloudflare Workers, plan gratuito).
# Despliegue: npx wrangler deploy  ·  Token de GitHub: npx wrangler secret put GITHUB_TOKEN
name = "garbillo-reportes"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
REPO = "flowmaticc/garbillo-reportes"

# Límites de envío y títulos → número de incidencia (schema.sql).
# El id lo da: npx wrangler d1 create garbillo-reportes
[[d1_databases]]
binding = "DB"
database_name = "garbillo-reportes"
database_id = "e8426714-a4eb-42f4-bfcf-439c3b050573"

# Borra cada día los contadores caducados.
[triggers]
crons = ["17 3 * * *"]

# Sin registros de peticiones en Cloudflare: el servicio no debe guardar IPs ni contenido.
[observability]
enabled = false
